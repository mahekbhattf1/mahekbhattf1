<svg width="850" height="980" viewBox="0 0 850 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,180,240,0.45)" />
      <stop offset="100%" stop-color="rgba(0,180,240,0)" />
    </radialGradient>
    <radialGradient id="grad-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(140,40,240,0.4)" />
      <stop offset="100%" stop-color="rgba(140,40,240,0)" />
    </radialGradient>
    <radialGradient id="grad-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,60,160,0.35)" />
      <stop offset="100%" stop-color="rgba(255,60,160,0)" />
    </radialGradient>
    <radialGradient id="headGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,210,240,0.28)" />
      <stop offset="100%" stop-color="rgba(255,210,240,0)" />
    </radialGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d0c0ff" />
      <stop offset="100%" stop-color="#7ee7ff" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7fb" />
      <stop offset="45%" stop-color="#ffd0ee" />
      <stop offset="100%" stop-color="#ff88cc" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffc6e8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes drift-r { 0%, 100% { transform: translate(0, 0); opacity: 0.7; } 50% { transform: translate(30px, -15px); opacity: 1; } }
    @keyframes drift-l { 0%, 100% { transform: translate(0, 0); opacity: 0.6; } 50% { transform: translate(-25px, 15px); opacity: 0.95; } }
    @keyframes hair-a { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    @keyframes hair-b { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; } }
    .g1 { animation: drift-r 7.5s ease-in-out infinite; }
    .g2 { animation: drift-l 6.5s ease-in-out infinite; }
    .h1 { animation: hair-a 4.5s ease-in-out infinite; }
    .h2 { animation: hair-b 6s ease-in-out infinite; }
  </style>

