  <ellipse class="g2" cx="700" cy="280" rx="240" ry="150" fill="url(#grad-purple)" />
  <ellipse class="g1" cx="160" cy="470" rx="220" ry="140" fill="url(#grad-pink)" />
  <ellipse class="g2" cx="680" cy="600" rx="200" ry="120" fill="url(#grad-cyan)" />

  <g transform="translate(25, 16)">
