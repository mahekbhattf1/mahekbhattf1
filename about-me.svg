<svg width="800" height="230" viewBox="0 0 800 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="abg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,180,240,0.45)" />
      <stop offset="100%" stop-color="rgba(0,180,240,0)" />
    </radialGradient>
    <radialGradient id="abg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(140,40,240,0.4)" />
      <stop offset="100%" stop-color="rgba(140,40,240,0)" />
    </radialGradient>
    <radialGradient id="abg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,60,160,0.3)" />
      <stop offset="100%" stop-color="rgba(255,60,160,0)" />
    </radialGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d0c0ff" />
      <stop offset="100%" stop-color="#7ee7ff" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(110,80,220,0.3)" />
      <stop offset="100%" stop-color="rgba(120,200,255,0.1)" />
    </linearGradient>
  </defs>

  <style>
    @keyframes drift-r { 0%, 100% { transform: translate(0, 0); opacity: 0.7; } 50% { transform: translate(30px, -15px); opacity: 1; } }
    @keyframes drift-l { 0%, 100% { transform: translate(0, 0); opacity: 0.6; } 50% { transform: translate(-25px, 15px); opacity: 0.95; } }
    .g1 { animation: drift-r 7.5s ease-in-out infinite; }
    .g2 { animation: drift-l 6.5s ease-in-out infinite; }
  </style>

  <rect width="800" height="230" rx="18" fill="#06060a" stroke="url(#borderGrad)" stroke-width="1"/>

  <ellipse class="g1" cx="120" cy="115" rx="190" ry="110" fill="url(#abg1)" />
  <ellipse class="g2" cx="700" cy="100" rx="170" ry="100" fill="url(#abg2)" />
  <ellipse cx="400" cy="190" rx="140" ry="80" fill="url(#abg3)" />

  <rect x="20" y="20" width="370" height="190" rx="14" fill="rgba(10,8,18,0.75)" stroke="rgba(100,70,200,0.22)" stroke-width="1"/>
  <text x="40" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="rgba(120,200,255,0.8)">PROFILE SUMMARY</text>
  <text x="40" y="78" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="800" fill="url(#headerGrad)">Data &amp; BI Analyst</text>
  <text x="40" y="104" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400" fill="rgba(200,200,230,0.85)">Transforming transactional &amp; customer records</text>
  <text x="40" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400" fill="rgba(200,200,230,0.85)">into clean, narrative-driven business decisions.</text>

  <circle cx="45" cy="154" r="3.5" fill="#7ee7ff"/>
  <text x="56" y="158" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#e0e0f0">KPI Tracking &amp; Executive Reporting</text>
  
  <circle cx="45" cy="178" r="3.5" fill="#e8c8ff"/>
  <text x="56" y="182" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#e0e0f0">Segmentation &amp; Predictive Insights</text>

  <rect x="410" y="20" width="370" height="190" rx="14" fill="rgba(10,8,18,0.75)" stroke="rgba(100,70,200,0.22)" stroke-width="1"/>
  <text x="430" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="rgba(200,120,255,0.8)">ANALYTICS CAPABILITIES</text>

  <rect x="430" y="70" width="8" height="8" rx="2" fill="#7ee7ff"/>
  <text x="446" y="78" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">End-to-End Pipeline</text>
  <text x="446" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#8a8ab0">Data cleaning, outlier audit, and feature derivation</text>

  <rect x="430" y="118" width="8" height="8" rx="2" fill="#e8c8ff"/>
  <text x="446" y="126" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Interactive Dashboards</text>
  <text x="446" y="142" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#8a8ab0">Slicer-driven visual exploration replacing static reports</text>

  <rect x="430" y="166" width="8" height="8" rx="2" fill="#ff88cc"/>
  <text x="446" y="174" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Commercial Intelligence</text>
  <text x="446" y="190" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#8a8ab0">E-commerce seasonality &amp; product margin drivers</text>
</svg>
